{% extends "base.html" %}

{% block titulo %}Editar embarque{% endblock %}

{% block contenido %}
    <h2>Editar embarque {{ id_embarque }}</h2>
    <p>Corrige los datos o las cantidades. El contenedor y el status no se pueden cambiar aqui.</p>
    <div id="datos-pagina" data-id="{{ id_embarque }}"></div>
    <form id="form-embarque" class="form panel panel-ancho">
        <div class="rejilla">
            <div>
                <label for="contenedor">Numero de contenedor</label>
                <input type="text" id="contenedor" disabled>
            </div>
            <div>
                <label for="origen">Origen</label>
                <input type="text" id="origen">
            </div>
            <div>
                <label for="puerto">Puerto de destino</label>
                <select id="puerto">
                    <option value="">Seleccionar...</option>
                    {% for p in puertos %}
                        <option value="{{ p }}">{{ p }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label for="naviera">Naviera</label>
                <input type="text" id="naviera">
            </div>
            <div>
                <label for="fecha-salida">Fecha de salida</label>
                <input type="date" id="fecha-salida">
            </div>
            <div>
                <label for="eta">ETA (llegada estimada)</label>
                <input type="date" id="eta">
            </div>
            <div>
                <label for="flete">Flete (USD)</label>
                <input type="number" id="flete" min="0" step="0.01">
            </div>
            <div>
                <label for="honorarios">Honorarios del agente (USD)</label>
                <input type="number" id="honorarios" min="0" step="0.01">
            </div>
        </div>
        <h3>SKUs del embarque</h3>
        <div id="filas-skus"></div>
        <button type="button" id="boton-agregar" class="boton boton-claro">Agregar SKU</button>
        <div class="acciones">
            <button type="submit" class="boton boton-principal">Guardar cambio</button>
            <a href="/embarques" class="boton boton-claro">Cancelar</a>
        </div>
    </form>
{% endblock %}

{% block scripts %}
    <script src="{{ url_for('static', filename='js/editar.js') }}"></script>
{% endblock %}

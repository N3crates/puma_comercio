{% extends "base.html" %}

{% block titulo %}Registrar embarque{% endblock %}

{% block contenido %}
    <h2>Registrar embarque</h2>
    <p>Capturar los datos del embarque y las cantidades del pedido y de la factura.</p>

    <form id="form-embarque" class="panel panel-ancho">
        <div class="rejilla">
            <div>
                <label for="contenedor">Numero de contenedor</label>
                <input type="text" id="contenedor" placeholder="Ej. MSKU1234567">
            </div>
            <div>
                <label for="origen">Origen</label>
                <input type="text" id="origen" placeholder="Ej. shanghai, china">
            </div>
            <div>
                <label for="puerto">Puerto de destino</label>
                <select id="puerto">
                    <option>Selecciona...</option>
                    <option value="Manzanillo">Manzanillo</option>
                    <option value="Lazaro Cardenas">Lazaro Cardenas</option>
                </select>
            </div>
            <div>
                <label for="naviera">Naviera</label>
                <input type="text" id="naviera" placeholder="Ej. Maersk">
            </div>
            <div>
                <label for="fecha-salida">Fecha de salida</label>
                <input type="date" id="fecha-salida">
            </div>
            <div>
                <label for="eta">ETA (llegada estimada)</label>
                <input type="date" id="eta">
            </div>
            <div>
                <label for="flete">Flete (USD)</label>
                <input type="number" id="flete" min="0" step="0.01">
            </div>
            <div>
                <label for="honorarios">Honorarios del agente (USD)</label>
                <input type="number" id="honorarios" min="0" step="0.01">
            </div>
        </div>
        <h3>SKUs del embarque</h3>
        <div id="filas-skus"></div>
        <button type="button" id="boton-agregar" class="boton boton-claro">Agregar SKU</button>
        <div class="acciones">
            <button type="submit" class="boton boton-principal">Registrar</button>
            <button type="button" id="boton-limpiar" class="boton boton-claro">Limpiar</button>
        </div>
    </form>
{% endblock %}

{% block scripts %}
    <script src="{{ url_for('static', filename='js/registrar.js') }}"></script>
{% endblock %}
